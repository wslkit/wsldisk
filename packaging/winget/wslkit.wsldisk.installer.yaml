# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: wslkit.wsldisk
PackageVersion: __VERSION__

# A single static executable with nothing to install: no registry keys, no
# service, no uninstaller. That is what winget calls a portable package, and the
# zip form of it is `zip` + `NestedInstallerType: portable`. winget puts the
# executable on PATH through its links directory and takes it off again on
# uninstall.
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: wsldisk.exe
    PortableCommandAlias: wsldisk

# wsldisk drives WSL2, which needs 64-bit Windows 10 2004 or later. Declaring
# the floor here means winget refuses to install it somewhere it cannot work,
# rather than handing the user a binary that fails at the first command.
MinimumOSVersion: 10.0.19041.0
InstallModes:
  - interactive
  - silent
UpgradeBehavior: install

Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/wslkit/wsldisk/releases/download/v__VERSION__/wsldisk-v__VERSION__-x64.zip
    InstallerSha256: __SHA256_X64__
  - Architecture: arm64
    InstallerUrl: https://github.com/wslkit/wsldisk/releases/download/v__VERSION__/wsldisk-v__VERSION__-arm64.zip
    InstallerSha256: __SHA256_ARM64__

ManifestType: installer
ManifestVersion: 1.6.0
