ShortDescription: Compact, shrink, move, inspect and snapshot WSL2 virtual disks
Description: |-
  Every WSL2 distribution — and Docker Desktop's data volume — lives in an
  ext4.vhdx file that only ever grows. Deleting files inside the distribution
  does not give the space back to Windows.

  wsldisk reclaims it: fstrim inside the guest, then an unattached
  CompactVirtualDisk, which needs no administrator rights and no Hyper-V
  PowerShell module. That last part is the point — it works on Windows Home,
  where Optimize-VHD does not exist.

  It also shows where the space went (list, info), tells a filesystem to release
  its unused blocks without stopping anything (trim), and finds virtual disks
  that no distribution claims (orphans).

  Every command has --json output and exit codes that mean something. WSL2 only:
  WSL1 distributions have no virtual disk, and wsldisk says so rather than
  pretending.

