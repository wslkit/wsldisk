name: release

# Everything a tag produces: a full matrix run, two native Release builds, an
# SBOM, provenance attestations, Sigstore signatures, a GitHub Release, and a
# smoke test that downloads what was actually published and runs it.
#
# The smoke job is the point of the whole file. Every step before it can succeed
# while producing a release nobody can use -- a zip missing the binary, a hash
# that does not match, an attestation over the wrong bytes. The only way to know
# is to fetch the published artifact on a clean machine and run it.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build a release from.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancelled. A half-published release is worse than a slow one.
  cancel-in-progress: false

env:
  VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching

jobs:
  # The full matrix, on the tag. Not a reuse of whatever a pull request left
  # behind: the thing being released has to be the thing that was tested.
  ci:
    name: full matrix
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    # Without this the called workflow sees an empty `secrets` context, and the
    # coverage job uploads to Codecov anonymously -- silently, because that step
    # is `fail_ci_if_error: false`.
    secrets: inherit

  build:
    name: build ${{ matrix.architecture }}
    needs: ci
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      # Keyless signing and provenance both mint an OIDC token.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
            preset: x64-release
            triplet: x64-windows-static
          - architecture: arm64
            runner: windows-11-arm
            preset: arm64-release
            triplet: arm64-windows-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup-toolchain
        with:
          architecture: ${{ matrix.architecture }}

      # Tests off, so the shipped binary's dependency set is the one the SBOM
      # describes. With the `tests` feature on, vcpkg installs Catch2 and the
      # SBOM would list a test framework as an input to a released product.
      - name: Configure
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} `
            -DWSLDISK_BUILD_TESTS=OFF `
            -DVCPKG_MANIFEST_FEATURES=

      - name: Build
        shell: pwsh
        run: cmake --build build/${{ matrix.preset }} --config Release

      - name: Smoke test the binary that will ship
        shell: pwsh
        run: |
          $exe = "build/${{ matrix.preset }}/src/cli/Release/wsldisk.exe"
          $reported = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "wsldisk --version exited with $LASTEXITCODE" }
          Write-Host "binary reports: $reported"

          # The tag and the version compiled into the binary are set in two
          # different places -- `project(wsldisk VERSION ...)` in CMakeLists.txt
          # and whatever was tagged -- and nothing else would notice them
          # disagreeing. Publishing `wsldisk-v0.2.0-x64.zip` containing a binary
          # that says 0.1.0 is the kind of thing a package manifest makes very
          # public.
          # Only the core `X.Y.Z`. A semver pre-release or build suffix --
          # `v0.1.0-rc.1` -- cannot appear in the binary, because CMake's
          # `project(VERSION)` is numeric and has nowhere to put it. Comparing
          # the whole tag made every release candidate fail this check, which is
          # the first thing the first release candidate would have found.
          $tag = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          $expected = ($tag -split '[-+]')[0]
          if ($reported -notmatch [regex]::Escape($expected)) {
              throw ("tag $tag does not match the built version: $reported. " +
                     "Update project(wsldisk VERSION ...) in CMakeLists.txt, or tag the version that is built.")
          }
          # `completion` is the one real command that needs no WSL, no registry
          # and no disk, so it can be exercised on a bare runner.
          & $exe completion bash > $null
          if ($LASTEXITCODE -ne 0) { throw "wsldisk completion exited with $LASTEXITCODE" }

      # Built from vcpkg's own SPDX documents rather than by scanning the
      # binary: it is statically linked, so a scanner finds almost nothing,
      # while vcpkg knows exactly which port at which version went in.
      - name: Generate the SBOM
        shell: pwsh
        run: |
          $releaseVersion = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          $spdx = Get-ChildItem `
            "build/${{ matrix.preset }}/vcpkg_installed/${{ matrix.triplet }}/share" `
            -Recurse -Filter vcpkg.spdx.json -ErrorAction SilentlyContinue
          if (-not $spdx) { throw "no vcpkg SPDX documents found; the SBOM would be empty" }

          $components = @()
          foreach ($file in $spdx) {
              $document = Get-Content $file.FullName -Raw | ConvertFrom-Json
              $port = $document.packages | Where-Object { $_.SPDXID -eq 'SPDXRef-port' } |
                  Select-Object -First 1
              if (-not $port) { continue }
              $licenses = @()
              if ($port.licenseConcluded -and $port.licenseConcluded -ne 'NOASSERTION') {
                  $licenses = @(@{ license = @{ id = $port.licenseConcluded } })
              }
              # vcpkg versions carry a port revision as `3.12.0#2`, and `#`
              # opens a subpath in a purl -- unencoded it would silently parse
              # as version 3.12.0 with a subpath of "2".
              $portVersion = "$($port.versionInfo)"
              $components += [ordered]@{
                  type    = 'library'
                  name    = $port.name
                  version = $portVersion
                  purl    = "pkg:vcpkg/$($port.name)@$($portVersion.Replace('#', '%23'))"
                  licenses = $licenses
              }
          }

          $sbom = [ordered]@{
              bomFormat    = 'CycloneDX'
              specVersion  = '1.5'
              version      = 1
              metadata     = [ordered]@{
                  timestamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
                  component = [ordered]@{
                      type    = 'application'
                      name    = 'wsldisk'
                      version = $releaseVersion
                      purl    = "pkg:github/${{ github.repository }}@${{ inputs.tag || github.ref_name }}"
                  }
                  tools = @(@{ name = 'wsldisk release.yml'; vendor = 'wsldisk' })
              }
              components = @($components | Sort-Object name)
          }
          $name = "wsldisk-${{ matrix.architecture }}.cdx.json"
          $sbom | ConvertTo-Json -Depth 12 | Out-File $name -Encoding utf8 -NoNewline
          Write-Host "SBOM lists $($components.Count) components:"
          $components | ForEach-Object { Write-Host "  $($_.name) $($_.version)" }

      - name: Stage and zip
        id: package
        shell: pwsh
        run: |
          $staging = 'staging'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "build/${{ matrix.preset }}/src/cli/Release/wsldisk.exe" $staging
          Copy-Item LICENSE, README.md $staging
          Copy-Item docs/COMPACT.md, docs/JSON.md $staging

          $zip = "wsldisk-${{ inputs.tag || github.ref_name }}-${{ matrix.architecture }}.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # One line per file, in the format `sha256sum -c` reads.
          $lines = foreach ($file in @($zip, "wsldisk-${{ matrix.architecture }}.cdx.json")) {
              (Get-FileHash $file -Algorithm SHA256).Hash.ToLower() + "  $file"
          }
          $lines | Out-File "SHA256SUMS-${{ matrix.architecture }}" -Encoding ascii
          Get-Content "SHA256SUMS-${{ matrix.architecture }}"

      # Provenance: a signed statement that these exact bytes came out of this
      # workflow, at this commit. `gh attestation verify` checks it, and the
      # smoke job does exactly that against what was published.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.zip }}
            wsldisk-${{ matrix.architecture }}.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-${{ matrix.architecture }}
          path: |
            ${{ steps.package.outputs.zip }}
            wsldisk-${{ matrix.architecture }}.cdx.json
            SHA256SUMS-${{ matrix.architecture }}
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Keyless cosign mints an OIDC token to bind the signature to this
      # workflow's identity.
      id-token: write
    steps:
      # Full history: the notes are the commits since the previous tag, and a
      # shallow clone has neither the tags nor the commits between them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Combine the checksums
        working-directory: artifacts
        run: |
          # `tr -d '\r'` is the whole point of this line. The per-architecture
          # files are written by PowerShell on Windows runners, so they arrive
          # with CRLF, and a SHA256SUMS with CRLF cannot be verified on Linux:
          #
          #   sha256sum: 'wsldisk-v0.1.0-rc.2-x64.zip'$'\r': No such file
          #
          # The carriage return becomes part of the filename. The release notes
          # tell people to run exactly that command, so publishing it this way
          # hands them a verification step that cannot pass. It also broke the
          # manifest substitution below, whose `$`-anchored patterns never
          # matched -- which is how it was noticed.
          cat SHA256SUMS-* | tr -d '\r' > SHA256SUMS
          rm SHA256SUMS-*
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Signing happens here rather than in the per-architecture build jobs, for
      # a blunt reason: cosign publishes no Windows arm64 binary -- the latest
      # release ships `cosign-windows-amd64.exe` and nothing else -- so the arm64
      # leg would either fail to install it or quietly depend on x64 emulation.
      # A signature is over bytes and does not care which machine produced them,
      # so both architectures are signed together on Linux, where cosign is a
      # first-class target.
      #
      # Keyless: the certificate binds the signature to this workflow's OIDC
      # identity, so there is no private key to hold and none to leak.
      #
      # One `.sigstore.json` bundle per file rather than a `.sig` and a `.pem`.
      # cosign v3 deprecated `--output-signature` and `--output-certificate` and
      # defaults to the new bundle format, and with no `--bundle` it tries to
      # write a bundle to an empty path: "create bundle file: open : no such
      # file or directory", which is exactly what the first release candidate
      # hit. The bundle carries the signature and the certificate together, so a
      # verifier fetches one file rather than remembering two.
      - name: Sign the artifacts
        working-directory: artifacts
        env:
          COSIGN_YES: 'true'
        run: |
          for file in *.zip *.cdx.json SHA256SUMS; do
            cosign sign-blob "$file" --bundle "$file.sigstore.json"
          done
          ls -l

      # Grouped from Conventional Commit subjects rather than from every merge
      # message: a release page is read by someone deciding whether to upgrade,
      # and "Merge pull request #57" tells them nothing.
      - name: Write the release notes
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..$TAG"
            echo "Notes cover $range"
          else
            range="$TAG"
            echo "First tag; notes cover everything up to $TAG"
          fi

          # 0x1f between subject and hash. A commit subject can contain any
          # printable character, and `completion powershell|bash|zsh` really did
          # break a `|` delimiter here -- the notes came out truncated at the
          # first pipe with the wrong hash beside them.
          #
          # Scopes are matched with `[(]` and `[)]`, not `\(` and `\)`. In GNU
          # grep 3.0's ERE a backslashed paren is *not* a literal paren --
          # `^feat\(cli\):` does not match `feat(cli): ...`, while
          # `^feat[(]cli[)]:` does. With the backslash form every scoped commit
          # was silently dropped: 24 of this repository's 54 commits, including
          # 15 of its 17 features. The notes looked plausible, which is why it
          # would have shipped.
          emit() {
            local pattern="$1" heading="$2"
            local body
            body=$(git log --no-merges --pretty=format:'%s%x1f%h' "$range" |
              grep -E "^$pattern" |
              sed -E 's/^[a-z]+([(][^)]*[)])?!?: *//' |
              awk -F'\x1f' '{ printf "- %s (%s)\n", $1, $2 }')
            if [ -n "$body" ]; then
              printf '### %s\n\n%s\n\n' "$heading" "$body" >> notes.md
            fi
          }

          # Every pattern anchors its colon, so a `feat!:` lands under breaking
          # changes and not under features as well.
          : > notes.md
          emit '[a-z]+([(][^)]*[)])?!:' 'Breaking changes'
          emit 'feat([(][^)]*[)])?:' 'Features'
          emit 'fix([(][^)]*[)])?:' 'Fixes'
          emit 'perf([(][^)]*[)])?:' 'Performance'
          emit 'docs([(][^)]*[)])?:' 'Documentation'
          emit '(test|ci|build|chore|refactor)([(][^)]*[)])?:' 'Internal'

          if [ ! -s notes.md ]; then
            echo "No Conventional Commit subjects in $range; falling back to the raw log." >&2
            git log --no-merges --pretty=format:'- %s (%h)' "$range" > notes.md
          fi

          cat >> notes.md <<'FOOTER'

          ### Verifying what you downloaded

          ```bash
          sha256sum -c SHA256SUMS
          gh attestation verify wsldisk-<version>-<arch>.zip --repo ${{ github.repository }}
          cosign verify-blob wsldisk-<version>-<arch>.zip \
              --bundle wsldisk-<version>-<arch>.zip.sigstore.json \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          ```

          The binaries are not Authenticode-signed yet; SmartScreen will warn on
          first run. See docs/CI.md for why and what would change it.
          FOOTER

          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            $prerelease \
            artifacts/*

      # The package manifests, filled in from what was just published. Written
      # here rather than by `wingetcreate new` so the wording, the tags and the
      # description are reviewed in this repository instead of being generated
      # by a tool whose output nobody reads.
      - name: Fill in the package manifests
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          x64=$(awk "/wsldisk-$TAG-x64.zip\$/ { print \$1 }" artifacts/SHA256SUMS)
          arm64=$(awk "/wsldisk-$TAG-arm64.zip\$/ { print \$1 }" artifacts/SHA256SUMS)
          if [ -z "$x64" ] || [ -z "$arm64" ]; then
            echo "::error::could not find both zip hashes in SHA256SUMS" >&2
            cat artifacts/SHA256SUMS >&2
            exit 1
          fi

          # winget's multi-file manifest is a directory, and wingetcreate reads
          # every file in it -- so the scoop manifest gets its own.
          mkdir -p manifests/winget manifests/scoop
          for file in packaging/winget/*.yaml; do
            sed -e "s/__VERSION__/$version/g" \
                -e "s/__SHA256_X64__/${x64^^}/g" \
                -e "s/__SHA256_ARM64__/${arm64^^}/g" \
                "$file" > "manifests/winget/$(basename "$file")"
          done

          # A placeholder left behind means a manifest that will be rejected, or
          # worse, accepted with a literal `__VERSION__` in it.
          if grep -rn '__[A-Z0-9_]*__' manifests/winget; then
            echo "::error::a placeholder survived substitution" >&2
            exit 1
          fi

          # Scoop's `autoupdate` block reads hashes from the published
          # SHA256SUMS for every *later* version, but the manifest checked in
          # here has placeholder zeros, and its own hashes have to be filled in
          # structurally: both architectures carry the same zero string, so a
          # textual replace cannot tell them apart.
          python3 - "$version" "$x64" "$arm64" <<'PYTHON'
          import json, sys
          version, x64, arm64 = sys.argv[1:4]
          with open('packaging/scoop/wsldisk.json', encoding='utf-8') as handle:
              manifest = json.load(handle)
          manifest['version'] = version
          for key, digest in (('64bit', x64), ('arm64', arm64)):
              entry = manifest['architecture'][key]
              entry['url'] = entry['url'].replace('0.0.0', version)
              entry['hash'] = digest
          with open('manifests/scoop/wsldisk.json', 'w', encoding='utf-8') as handle:
              print(json.dumps(manifest, indent=4), file=handle)
          PYTHON

          # Same reasoning as the winget check above: a zero hash or a 0.0.0 URL
          # surviving into a published manifest is an install that fails for
          # everyone who tries it.
          if grep -n '0\.0\.0\|0\{64\}' manifests/scoop/wsldisk.json; then
            echo "::error::a placeholder survived in the scoop manifest" >&2
            exit 1
          fi

          echo "--- winget installer manifest ---"
          cat manifests/winget/wslkit.wsldisk.installer.yaml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: package-manifests
          path: manifests
          if-no-files-found: error


  # A machine that has never seen this repository downloads what was published
  # and runs it. Everything above can pass while producing a release that does
  # not work; this is what would notice.
  smoke:
    name: smoke ${{ matrix.architecture }}
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      # `gh attestation verify` reads the attestation from the API.
      attestations: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - name: Download the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release download $env:TAG --repo ${{ github.repository }} `
              --pattern "wsldisk-$env:TAG-${{ matrix.architecture }}.zip" `
              --pattern 'SHA256SUMS'
          if ($LASTEXITCODE -ne 0) { throw "could not download the release assets" }

      - name: Check the checksum
        shell: pwsh
        run: |
          $zip = "wsldisk-${{ inputs.tag || github.ref_name }}-${{ matrix.architecture }}.zip"
          $expected = (Select-String -Path SHA256SUMS -Pattern ([regex]::Escape($zip)) |
              Select-Object -First 1).Line.Split(' ')[0]
          if (-not $expected) { throw "$zip is not listed in SHA256SUMS" }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "checksum mismatch: $actual != $expected" }
          Write-Host "checksum ok: $actual"

      - name: Verify the provenance attestation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "wsldisk-${{ inputs.tag || github.ref_name }}-${{ matrix.architecture }}.zip"
          gh attestation verify $zip --repo ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) { throw "provenance verification failed for $zip" }

      - name: Run it
        shell: pwsh
        run: |
          Expand-Archive -Path "wsldisk-${{ inputs.tag || github.ref_name }}-${{ matrix.architecture }}.zip" `
              -DestinationPath unpacked -Force
          $exe = 'unpacked/wsldisk.exe'

          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version exited with $LASTEXITCODE" }

          # `list --json` on a runner with no WSL: exit 3 with a parseable error
          # object is the correct answer, and 0 with distributions is correct on
          # one that has it. A crash or unparseable stdout is not.
          $output = & $exe list --json 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "list --json exited $code with: $output"
          if ($code -ne 0 -and $code -ne 3) { throw "list --json exited with $code" }
          foreach ($line in ($output -split "`n" | Where-Object { $_.Trim() })) {
              $null = $line | ConvertFrom-Json   # throws if stdout is not parseable
          }

          & $exe completion powershell > $null
          if ($LASTEXITCODE -ne 0) { throw "completion exited with $LASTEXITCODE" }


  # Only after the smoke job has downloaded the published zip and run it. A
  # winget pull request is public and slow to withdraw: submitting a release
  # nobody has executed is how a broken build ends up on other people's
  # machines.
  winget:
    name: submit to winget
    needs: smoke
    # Pre-releases are for us, not for a package manager. `v0.1.0-rc.1` is
    # published, signed and smoke-tested like any other tag, and stops there.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: package-manifests
          path: manifests

      - name: Submit
        shell: pwsh
        env:
          # A classic PAT with `public_repo`, belonging to an account that has
          # forked microsoft/winget-pkgs. `github.token` cannot be used: it has
          # no rights outside this repository.
          WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          Get-ChildItem manifests -Recurse -File | ForEach-Object { Write-Host $_.FullName }

          winget install --id Microsoft.WingetCreate `
              --source winget --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { throw "installing wingetcreate exited with $LASTEXITCODE" }

          # Validation is worth running whether or not the token exists: a
          # manifest this workflow generated wrongly should fail the release,
          # not sit unnoticed in an artifact until someone submits it by hand.
          wingetcreate validate --manifest manifests/winget
          if ($LASTEXITCODE -ne 0) { throw "the generated manifests are not valid" }

          if (-not $env:WINGET_TOKEN) {
              Write-Host '::notice::WINGET_GITHUB_TOKEN is not set, so no pull request was opened.'
              Write-Host "The validated manifests are attached to this run as ``package-manifests``;"
              Write-Host 'submit them by hand, or set the secret and re-run this job.'
              exit 0
          }

          wingetcreate submit --token $env:WINGET_TOKEN `
              --prtitle "New version: wslkit.wsldisk version $($env:TAG.TrimStart('v'))" `
              manifests/winget
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit exited with $LASTEXITCODE" }
